name: Branch Debug Build

on:
  push:
    branches:
      - optimize-filters-cloud-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Unit tests
        run: ./gradlew testDownloadModelDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDownloadModelDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearScan-debug-apk
          path: app/build/outputs/apk/downloadModel/debug/app-downloadModel-debug.apk
          retention-days: 30
