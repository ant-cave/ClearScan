name: Branch Debug Build

on:
  push:
    branches:
      - main
      - optimize-filters-cloud-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee gradle-test.log
      - name: Publish failure diagnostics
        if: failure()
        run: |
          {
            echo "## CI failure diagnostics"
            echo '```text'
            grep -nE "^e: |error: |Unresolved reference|Compilation error|FAILED|Caused by|Execution failed for task" gradle-test.log 2>/dev/null | head -100
            echo "--- tail ---"
            tail -40 gradle-test.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearScan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
