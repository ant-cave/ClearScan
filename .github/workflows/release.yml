#
# Pushing a v* tag builds the signed release APK and publishes it
# as a GitHub Release together with its SHA-256 checksum.

name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLEARSCAN_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clearscan-release.jks"
      - name: Verify tag matches app version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "app versionName: $VERSION_NAME"
          echo "pushed tag:       $GITHUB_REF_NAME"
          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app versionName v$VERSION_NAME in app/build.gradle.kts. Bump versionName/versionCode before tagging."
            exit 1
          fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build signed release APK
        env:
          CLEARSCAN_KEYSTORE_PATH: ${{ runner.temp }}/clearscan-release.jks
          CLEARSCAN_KEYSTORE_PASSWORD: ${{ secrets.CLEARSCAN_KEYSTORE_PASSWORD }}
          CLEARSCAN_KEY_ALIAS: ${{ secrets.CLEARSCAN_KEY_ALIAS }}
          CLEARSCAN_KEY_PASSWORD: ${{ secrets.CLEARSCAN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Prepare release asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ClearScan-${GITHUB_REF_NAME}-arm64-v8a.apk"
          sha256sum "ClearScan-${GITHUB_REF_NAME}-arm64-v8a.apk" > "ClearScan-${GITHUB_REF_NAME}-arm64-v8a.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ClearScan-${GITHUB_REF_NAME}-arm64-v8a.apk" "ClearScan-${GITHUB_REF_NAME}-arm64-v8a.apk.sha256" --generate-notes --verify-tag
